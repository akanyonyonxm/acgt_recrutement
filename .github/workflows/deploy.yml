name: Déploiement

# Déploiement continu sur le VPS recrutement.acgt.cd.
# - À chaque push sur `main` : vérification puis déploiement SSH.
# - Lançable aussi manuellement depuis l'onglet Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # --- 1. Vérifications (bloque le déploiement si elles échouent) ---
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend : checks Django + cohérence des migrations.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifications Django
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-non-sensible
          DEBUG: 'True'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      # Frontend : le build doit passer.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build du frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # --- 2. Déploiement SSH sur le VPS (seulement sur main, après vérifs) ---
  deploiement:
    name: Déploiement VPS
    needs: verifier
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Environnement GitHub « production » : permet d'exiger une approbation
    # manuelle et de cloisonner les secrets (facultatif, configurable côté repo).
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      # Tant que les secrets DEPLOY_* ne sont pas renseignés, on saute le
      # déploiement au lieu de faire échouer la CI (« missing server host »).
      - name: Vérifier la présence des secrets de déploiement
        id: gate
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Secrets DEPLOY_* non configurés — déploiement ignoré."
            echo "pret=false" >> "$GITHUB_OUTPUT"
          else
            echo "pret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Connexion SSH et déploiement
        if: steps.gate.outputs.pret == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
