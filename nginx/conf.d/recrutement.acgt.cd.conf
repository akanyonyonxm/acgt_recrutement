# Reverse-proxy + service de la SPA Vue + terminaison TLS pour
# recrutement.acgt.cd. Le backend Django/Gunicorn écoute sur le service `backend`.

upstream backend {
    server backend:8000;
}

# --- HTTP (port 80) : challenge ACME + redirection vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name recrutement.acgt.cd;

    # Let's Encrypt dépose ici le jeton de validation (webroot partagé certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste -> HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (port 443) : application ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recrutement.acgt.cd;

    # Certificats Let's Encrypt (volume certbot, voir docker-compose.yml).
    ssl_certificate     /etc/letsencrypt/live/recrutement.acgt.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recrutement.acgt.cd/privkey.pem;
    # Paramètres SSL recommandés + DH, générés par init-letsencrypt.sh.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # En-tête HSTS (Django l'ajoute déjà, doublon inoffensif et défensif).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Taille max des uploads : pièces jointes 5 Mo + marge (multipart).
    client_max_body_size 10M;

    # Renouvellement ACME possible aussi en HTTPS si besoin.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- API et back-office Django -> Gunicorn ---
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-auth/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statiques Django (admin, DRF) servis par WhiteNoise via Gunicorn.
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Téléchargement des pièces jointes (privé : Django vérifie l'auth et le
    # scope, renvoie un FileResponse). On ne sert JAMAIS /media en direct.
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA Vue : tout le reste renvoie index.html (history mode) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
