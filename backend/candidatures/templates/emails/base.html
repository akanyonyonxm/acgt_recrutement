<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_nom }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
          <tr>
            <td style="background:#1a237e;padding:22px 28px;">
              <span style="color:#ffffff;font-size:19px;font-weight:bold;letter-spacing:0.5px;">ACGT</span>
              <span style="color:#c5cae9;font-size:13px;"> · Recrutement</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-size:15px;line-height:1.6;">
              {% block contenu %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f4f5f7;font-size:12px;color:#7b8794;">
              Cet email vous est envoyé par {{ site_nom }}. Merci de ne pas y répondre directement.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
